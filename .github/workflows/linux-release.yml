name: Linux release build

# Builds the x86_64 onedir bundle on a GitHub-hosted Ubuntu runner and attaches
# the tar.gz to an existing release. Manual trigger only: the maintainer decides
# when a release gets a Linux asset. The resulting binary needs glibc >= 2.39
# (Ubuntu 24.04+, Mint 22, Fedora 40+, Debian 13).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the tar.gz to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04 # x86_64, system Python 3.12
    steps:
      - uses: actions/checkout@v4

      - name: Install the GTK backend and Python dependencies
        # System python3-gi avoids compiling PyGObject from pip; the venv sees
        # it through --system-site-packages.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Build the native save3ds helper (pinned, FUSE disabled)
        run: bash tools/build_save3ds_macos.sh

      - name: Build the onedir bundle
        run: .venv/bin/python -m PyInstaller --clean --noconfirm 3DSort.linux.spec

      - name: Selftest the bundled resources
        run: dist/3DSort/3DSort --selftest

      - name: Pack the tar.gz
        # tar preserves exec bits; the archive extracts to a 3DSort/ directory
        run: tar -czf "3DSort-${{ inputs.tag }}-linux-x86_64.tar.gz" -C dist 3DSort

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "3DSort-${{ inputs.tag }}-linux-x86_64.tar.gz" --clobber
